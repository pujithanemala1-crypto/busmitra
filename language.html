<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Language - BusMitra</title>
  <meta name="description" content="Select your preferred regional or international language for BusMitra smart transit companion.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .lang-selection-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 20%, #eff6ff 0%, #f8fafc 100%);
    }

    .lang-card {
      width: 100%;
      max-width: 680px;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
      max-height: 380px;
      overflow-y: auto;
      padding: 0.5rem 0.25rem;
      margin: 1.5rem 0;
      scrollbar-width: thin;
    }

    .lang-item-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0.875rem 1rem;
      border-radius: var(--radius-md);
      background-color: var(--bg-surface-alt);
      border: 1.5px solid var(--border-subtle);
      text-align: left;
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .lang-item-btn:hover {
      border-color: var(--color-royal-blue);
      background-color: #EEF2FF;
      transform: translateY(-1px);
    }

    .lang-item-btn.selected {
      border-color: var(--color-royal-blue);
      background-color: #EFF6FF;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2);
    }

    .lang-native-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-navy);
    }

    .lang-english-name {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-link">
        <div class="brand-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.6 19.1 6 18 6H4C2.9 6 1.9 6.6 1.6 7.8L.2 12.8c-.1.4-.2.8-.2 1.2 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
          </svg>
        </div>
        <span class="brand-text">Bus<span class="brand-text-accent">Mitra</span></span>
      </a>
      <div style="font-size:0.875rem; color:var(--text-muted);">
        Step 1 of 2: Language Preference
      </div>
    </div>
  </header>

  <!-- Language Selection Main -->
  <main class="lang-selection-hero">
    <div class="lang-card fade-in">
      
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:50%; background:#EFF6FF; color:#1D4ED8; margin-bottom:0.75rem;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--color-navy); margin-bottom: 0.35rem;">
          Choose Your Preferred Language
        </h1>
        <p style="color: var(--text-muted); font-size: 0.9375rem;">
          Select your comfortable language for bus tracking, voice directions, and seat notifications.
        </p>
      </div>

      <!-- Searchable Filter Box -->
      <div class="input-wrapper" style="margin-bottom: 1rem;">
        <span class="input-icon-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input 
          id="lang-search-input" 
          type="text" 
          class="form-control" 
          placeholder="Search by language name (e.g., Telugu, Hindi, Tamil...)" 
          style="padding-left: 2.75rem;"
        >
      </div>

      <!-- Languages Grid (21 Languages) -->
      <div id="languages-grid" class="lang-grid">
        <!-- Rendered dynamically by language selection script -->
      </div>

      <!-- Selected Language Summary & Continue Button -->
      <div style="border-top: 1px solid var(--border-subtle); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.875rem;">
          <span style="color: var(--text-muted);">Selected Language:</span>
          <span id="selected-lang-label" style="font-weight: 700; color: var(--color-royal-blue);">English (English)</span>
        </div>

        <button id="confirm-language-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>Continue to BusMitra Home</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

    </div>
  </main>

  <script src="js/language.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const grid = document.getElementById("languages-grid");
      const searchInput = document.getElementById("lang-search-input");
      const label = document.getElementById("selected-lang-label");
      const continueBtn = document.getElementById("confirm-language-btn");

      let selectedCode = window.getCurrentLanguage() || "en";

      function renderList(query = "") {
        const filtered = window.BUSMITRA_LANGUAGES.filter(l => 
          l.name.toLowerCase().includes(query.toLowerCase()) || 
          l.native.toLowerCase().includes(query.toLowerCase()) ||
          l.region.toLowerCase().includes(query.toLowerCase())
        );

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color: #64748B;">No matching languages found.</div>`;
          return;
        }

        grid.innerHTML = filtered.map(lang => `
          <button type="button" class="lang-item-btn ${lang.code === selectedCode ? 'selected' : ''}" data-code="${lang.code}">
            <span class="lang-native-name">${lang.native}</span>
            <span class="lang-english-name">${lang.name} · ${lang.region}</span>
          </button>
        `).join("");

        // Add click events
        grid.querySelectorAll(".lang-item-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedCode = btn.getAttribute("data-code");
            const langObj = window.BUSMITRA_LANGUAGES.find(l => l.code === selectedCode);
            if (label && langObj) {
              label.textContent = `${langObj.native} (${langObj.name})`;
            }
            grid.querySelectorAll(".lang-item-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
          });
        });
      }

      // Initial Render
      renderList();
      const initialLangObj = window.BUSMITRA_LANGUAGES.find(l => l.code === selectedCode);
      if (label && initialLangObj) {
        label.textContent = `${initialLangObj.native} (${initialLangObj.name})`;
      }

      // Search filter
      searchInput.addEventListener("input", (e) => {
        renderList(e.target.value.trim());
      });

      // Save & Continue
      continueBtn.addEventListener("click", () => {
        window.setCurrentLanguage(selectedCode);
        window.location.href = "home.html";
      });
    });
  </script>
</body>
</html>
