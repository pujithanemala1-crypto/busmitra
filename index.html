<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusMitra - Smart Public Transportation & Live Bus Tracking</title>
  <meta name="description" content="Your Travel Buddy, Always! Smart public transportation system with live bus tracking, real-time IR sensor crowd monitoring, seat availability, and ETA prediction.">
  <meta property="og:title" content="BusMitra - Smart Public Transportation & Live Bus Tracking">
  <meta property="og:description" content="Your Travel Buddy, Always! Smart public transportation system with live bus tracking, real-time IR sensor crowd monitoring, seat availability, and ETA prediction.">
  <meta property="og:type" content="website">
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="overflow: hidden; background: #070e1b;">

  <!-- Cinematic Intro Road Stage -->
  <div id="intro-stage" class="intro-stage">
    
    <!-- Top Right Floating Controls -->
    <div class="intro-controls">
      <button id="intro-sound-toggle" class="intro-btn" title="Toggle Vehicle Movement Sound">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <span>Sound OFF</span>
      </button>
      <button id="skip-intro-btn" class="intro-btn" style="background: rgba(29, 78, 216, 0.85); border-color: #06B6D4;">
        <span>Skip Intro</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <!-- Sky Backdrop & City Skyline -->
    <div class="intro-backdrop">
      <div style="position: absolute; top: 12%; left: 8%; color: rgba(255,255,255,0.25); font-size: 0.85rem; letter-spacing: 0.15em; font-weight: 600;">
        SMART PUBLIC MOBILITY NETWORK · ANDHRA PRADESH
      </div>
      
      <!-- City Silhouette SVG / Pattern -->
      <svg class="city-silhouette" preserveAspectRatio="none" viewBox="0 0 1200 220" fill="none">
        <path d="M0,220 L0,150 L30,150 L30,120 L60,120 L60,180 L80,180 L80,90 L110,90 L110,60 L130,60 L130,170 L160,170 L160,110 L190,110 L190,70 L210,70 L210,220 L230,220 L230,130 L260,130 L260,100 L280,100 L280,190 L320,190 L320,80 L350,80 L350,50 L380,50 L380,140 L420,140 L420,100 L450,100 L450,220 L480,220 L480,120 L510,120 L510,70 L540,70 L540,160 L580,160 L580,90 L610,90 L610,40 L640,40 L640,180 L670,180 L670,110 L710,110 L710,220 L750,220 L750,130 L780,130 L780,80 L810,80 L810,150 L840,150 L840,60 L870,60 L870,170 L910,170 L910,100 L950,100 L950,220 L990,220 L990,120 L1020,120 L1020,50 L1060,50 L1060,160 L1100,160 L1100,90 L1140,90 L1140,140 L1200,140 L1200,220 Z" fill="#15243d"/>
        <path d="M0,220 L0,170 L40,170 L40,140 L70,140 L70,220 L120,220 L120,160 L150,160 L150,130 L180,130 L180,220 L240,220 L240,150 L270,150 L270,180 L300,180 L300,220 L360,220 L360,140 L390,140 L390,120 L430,120 L430,220 L490,220 L490,160 L520,160 L520,130 L560,130 L560,220 L620,220 L620,150 L660,150 L660,180 L700,180 L700,220 L760,220 L760,140 L800,140 L800,110 L840,110 L840,220 L900,220 L900,170 L940,170 L940,130 L980,130 L980,220 L1040,220 L1040,150 L1080,150 L1080,180 L1120,180 L1120,220 L1200,220 Z" fill="#0d182b"/>
      </svg>
    </div>

    <!-- Scenery: Trees and Streetlights -->
    <div class="scenery-layer">
      <!-- Streetlight 1 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:28px; height:8px; background:#475569; border-radius:4px; box-shadow:0 0 16px rgba(254, 240, 138, 0.9);"></div>
        <div style="width:4px; height:82px; background:#334155;"></div>
      </div>
      <!-- Tree 1 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:48px; height:48px; border-radius:50%; background:#14532d; opacity:0.85;"></div>
        <div style="width:6px; height:24px; background:#451a03;"></div>
      </div>
      <!-- Streetlight 2 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:28px; height:8px; background:#475569; border-radius:4px; box-shadow:0 0 16px rgba(254, 240, 138, 0.9);"></div>
        <div style="width:4px; height:82px; background:#334155;"></div>
      </div>
      <!-- Tree 2 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:54px; height:54px; border-radius:50%; background:#166534; opacity:0.85;"></div>
        <div style="width:6px; height:26px; background:#451a03;"></div>
      </div>
      <!-- Streetlight 3 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:28px; height:8px; background:#475569; border-radius:4px; box-shadow:0 0 16px rgba(254, 240, 138, 0.9);"></div>
        <div style="width:4px; height:82px; background:#334155;"></div>
      </div>
    </div>

    <!-- Road Surface with Lane Markings -->
    <div class="road-container">
      <div class="road-curb"></div>
      <div id="road-markings" class="road-markings"></div>
    </div>

    <!-- Realistic Bus Actor (Moving from Left to Right via GSAP) -->
    <div id="bus-actor" class="bus-actor-wrap">
      <div class="headlight-beam"></div>
      <div class="bus-ground-shadow"></div>
      
      <!-- Realistic SVG Bus Model -->
      <svg class="bus-svg bus-chassis" viewBox="0 0 420 155" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main Chassis Body -->
        <rect x="20" y="24" width="370" height="92" rx="14" fill="#1D4ED8"/>
        <!-- Aerodynamic Front Slope -->
        <path d="M370 24 C388 24, 398 42, 398 68 L398 102 C398 110, 390 116, 380 116 L20 116 C12 116, 6 110, 6 102 L6 38 C6 30, 12 24, 20 24 Z" fill="#1D4ED8"/>
        
        <!-- Cyan Accent Belt & Smart Mobility Graphics -->
        <path d="M6 76 L398 76 L398 88 L6 88 Z" fill="#06B6D4"/>
        <path d="M20 24 L380 24 C388 24, 392 28, 392 34 L392 40 L6 40 L6 34 C6 28, 12 24, 20 24 Z" fill="#0F172A"/>
        
        <!-- Electronic Destination Board -->
        <rect x="290" y="27" width="94" height="11" rx="2" fill="#020617"/>
        <text x="337" y="36" fill="#FACC15" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">VIJAYAWADA → GUNTUR</text>
        
        <!-- Large Passenger Tinted Windows -->
        <rect x="20" y="44" width="46" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="74" y="44" width="52" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="134" y="44" width="52" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="194" y="44" width="52" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="254" y="44" width="52" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <!-- Driver Windshield & Front Glass -->
        <path d="M314 44 L378 44 C384 44, 388 48, 390 56 L392 74 L314 74 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        
        <!-- Brand Logo on Bus Side -->
        <text x="140" y="104" fill="#FFFFFF" font-size="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" letter-spacing="0.5">BUSMITRA</text>
        <text x="238" y="104" fill="#22D3EE" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">IoT SMART</text>

        <!-- Entry Door & Exit Door with IR Sensor Housing Indicators -->
        <rect x="78" y="78" width="22" height="38" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
        <rect x="258" y="78" width="22" height="38" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
        <!-- IR Sensor Indicator Bulbs -->
        <circle cx="89" cy="80" r="2.5" fill="#22D3EE"/>
        <circle cx="269" cy="80" r="2.5" fill="#22D3EE"/>
        
        <!-- Headlights -->
        <rect x="390" y="86" width="7" height="14" rx="2" fill="#FEF08A"/>
        <!-- Taillights -->
        <rect x="6" y="86" width="6" height="14" rx="2" fill="#EF4444"/>

        <!-- Rear Wheel Well & Wheel -->
        <path d="M58 116 A 25 25 0 0 1 112 116 Z" fill="#0F172A"/>
        <g class="wheel-rotate" style="transform-origin: 85px 116px;">
          <circle cx="85" cy="116" r="22" fill="#1E293B" stroke="#475569" stroke-width="3"/>
          <circle cx="85" cy="116" r="14" fill="#94A3B8"/>
          <circle cx="85" cy="116" r="6" fill="#0F172A"/>
          <line x1="85" y1="94" x2="85" y2="138" stroke="#0F172A" stroke-width="2"/>
          <line x1="63" y1="116" x2="107" y2="116" stroke="#0F172A" stroke-width="2"/>
        </g>

        <!-- Front Wheel Well & Wheel -->
        <path d="M308 116 A 25 25 0 0 1 362 116 Z" fill="#0F172A"/>
        <g class="wheel-rotate" style="transform-origin: 335px 116px;">
          <circle cx="335" cy="116" r="22" fill="#1E293B" stroke="#475569" stroke-width="3"/>
          <circle cx="335" cy="116" r="14" fill="#94A3B8"/>
          <circle cx="335" cy="116" r="6" fill="#0F172A"/>
          <line x1="335" y1="94" x2="335" y2="138" stroke="#0F172A" stroke-width="2"/>
          <line x1="313" y1="116" x2="357" y2="116" stroke="#0F172A" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <!-- Elegant Logo Reveal Stage (Appears after bus exits screen) -->
    <div id="logo-reveal-stage" class="logo-reveal-stage">
      <div class="logo-big-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6v6"/>
          <path d="M15 6v6"/>
          <path d="M2 12h19.6"/>
          <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.6 19.1 6 18 6H4C2.9 6 1.9 6.6 1.6 7.8L.2 12.8c-.1.4-.2.8-.2 1.2 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3"/>
          <circle cx="7" cy="18" r="2"/>
          <path d="M9 18h5"/>
          <circle cx="16" cy="18" r="2"/>
        </svg>
      </div>
      <h1 class="logo-big-title">BUS<span>MITRA</span></h1>
      <p class="logo-tagline">Your Travel Buddy, Always!</p>
      
      <div style="display:flex; align-items:center; gap:0.75rem; margin-top:1rem;">
        <a id="logo-continue-btn" href="language.html" class="btn btn-cyan btn-lg" style="box-shadow: 0 0 25px rgba(6,182,212,0.45);">
          <span>Continue to Language Selection</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
    </div>

  </div>

  <!-- GSAP Animation Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <!-- Core Scripts -->
  <script src="js/language.js"></script>
  <script src="js/app.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
